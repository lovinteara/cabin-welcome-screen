<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Outer glow -->
  <circle cx="60" cy="60" r="58" fill="#0a0a1a" stroke="#2a2a4a" stroke-width="1"/>
  <circle cx="60" cy="60" r="54" fill="#f8f0d8" opacity="0.1"/>
  <circle cx="60" cy="60" r="50" fill="#f8f0d8" opacity="0.15"/>
  <!-- Moon body -->
  <circle cx="60" cy="60" r="46" fill="#e8e0c8"/>
  <!-- Mare (dark areas) -->
  <ellipse cx="52" cy="48" rx="14" ry="10" fill="#c0b898" opacity="0.5" transform="rotate(-15,52,48)"/>
  <ellipse cx="70" cy="55" rx="10" ry="7" fill="#c8c0a8" opacity="0.4" transform="rotate(10,70,55)"/>
  <ellipse cx="48" cy="70" rx="8" ry="6" fill="#c0b898" opacity="0.35"/>
  <ellipse cx="72" cy="72" rx="6" ry="5" fill="#c8c0a8" opacity="0.3" transform="rotate(-5,72,72)"/>
  <!-- Craters -->
  <circle cx="40" cy="42" r="5" fill="#b8b098" opacity="0.4"/>
  <circle cx="78" cy="40" r="4" fill="#c0b898" opacity="0.35"/>
  <circle cx="82" cy="70" r="3" fill="#b8b098" opacity="0.4"/>
  <circle cx="38" cy="78" r="4" fill="#c0b898" opacity="0.35"/>
  <!-- Bright limb -->
  <circle cx="60" cy="60" r="46" fill="none" stroke="#fff" stroke-width="2" opacity="0.25"/>
  <circle cx="60" cy="60" r="50" fill="none" stroke="#f8e880" stroke-width="3" opacity="0.2"/>
  <circle cx="60" cy="60" r="54" fill="none" stroke="#f8e880" stroke-width="4" opacity="0.1"/>
</svg>