<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg-guy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1a0a"/>
      <stop offset="100%" style="stop-color:#1a1a0a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg-guy)" rx="12"/>
  <!-- Mountains in background -->
  <polygon points="0,200 70,110 140,200" fill="#2a3a2a"/>
  <polygon points="80,200 160,90 240,200" fill="#3a4a3a"/>
  <polygon points="200,200 270,105 340,200" fill="#2a3a2a"/>
  <polygon points="300,200 370,118 400,200" fill="#3a4a3a"/>
  <!-- Beer mugs clinking -->
  <g transform="translate(120,115)">
    <rect x="0" y="0" width="40" height="60" fill="#c8973a" rx="4" opacity="0.9"/>
    <rect x="38" y="15" width="12" height="20" fill="#c8973a" rx="6" opacity="0.7"/>
    <rect x="4" y="4" width="32" height="52" fill="#f8e060" rx="3" opacity="0.3"/>
    <ellipse cx="20" cy="0" rx="20" ry="8" fill="#fff" opacity="0.7"/>
  </g>
  <g transform="translate(200,110)">
    <rect x="0" y="0" width="40" height="60" fill="#c8973a" rx="4" opacity="0.9"/>
    <rect x="-12" y="15" width="12" height="20" fill="#c8973a" rx="6" opacity="0.7"/>
    <rect x="4" y="4" width="32" height="52" fill="#f8e060" rx="3" opacity="0.3"/>
    <ellipse cx="20" cy="0" rx="20" ry="8" fill="#fff" opacity="0.7"/>
  </g>
  <!-- Foam splash at clink -->
  <circle cx="200" cy="112" r="8" fill="#fff" opacity="0.6"/>
  <circle cx="195" cy="105" r="5" fill="#fff" opacity="0.4"/>
  <circle cx="205" cy="104" r="4" fill="#fff" opacity="0.4"/>
  <!-- Campfire -->
  <ellipse cx="200" cy="248" rx="30" ry="6" fill="#4a2a10" opacity="0.8"/>
  <rect x="183" y="230" width="6" height="20" fill="#5a3a18" rx="2" transform="rotate(-10,186,240)"/>
  <rect x="211" y="230" width="6" height="20" fill="#5a3a18" rx="2" transform="rotate(10,214,240)"/>
  <rect x="197" y="228" width="6" height="22" fill="#4a2a10" rx="2"/>
  <ellipse cx="200" cy="228" rx="14" ry="8" fill="#e85020" opacity="0.8"/>
  <ellipse cx="200" cy="224" rx="9" ry="6" fill="#f07820" opacity="0.8"/>
  <ellipse cx="200" cy="221" rx="5" ry="4" fill="#ffd040" opacity="0.8"/>
  <!-- Stars -->
  <circle cx="50" cy="50" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="100" cy="30" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="300" cy="40" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="350" cy="25" r="1.5" fill="#fff" opacity="0.6"/>
  <!-- Banner -->
  <rect x="60" y="55" width="280" height="52" fill="#1a3a1a" rx="8" opacity="0.95"/>
  <text x="200" y="80" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#ffd700" font-weight="bold">Guys Trip!</text>
  <text x="200" y="99" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#c8e0a0" opacity="0.8">Good times ahead</text>
</svg>