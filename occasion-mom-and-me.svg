  <rect x="55" y="35" width="290" height="55" fill="#3a0a3a" rx="8" opacity="0.95"/>
  <text x="200" y="62" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#ffd700" font-weight="bold">Mom and Me!</text>
  <text x="200" y="82" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#f0c8f0" opacity="0.8">Special memories together</text>
</svg>