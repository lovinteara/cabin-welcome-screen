<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 60" width="160" height="60">
  <rect width="160" height="60" rx="30" fill="#5a1a1a" opacity="0.95"/>
  <rect width="160" height="60" rx="30" fill="none" stroke="#f0928f" stroke-width="2" opacity="0.7"/>
  <!-- Hiker leaning forward -->
  <circle cx="26" cy="16" r="7" fill="#f0928f"/>
  <line x1="26" y1="23" x2="22" y2="40" stroke="#f0928f" stroke-width="3" stroke-linecap="round"/>
  <line x1="24" y1="30" x2="16" y2="33" stroke="#f0928f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="24" y1="30" x2="32" y2="28" stroke="#f0928f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="22" y1="40" x2="16" y2="50" stroke="#f0928f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="22" y1="40" x2="28" y2="50" stroke="#f0928f" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Trekking poles -->
  <line x1="34" y1="26" x2="40" y2="50" stroke="#f0928f" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="14" y1="32" x2="10" y2="52" stroke="#f0928f" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- Steep mountain -->
  <path d="M44,52 L70,15 L85,35 L100,10 L130,45 L145,52" stroke="#f0928f" stroke-width="2.5" fill="none" opacity="0.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Text -->
  <text x="96" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="16" font-weight="bold" fill="#f0928f">HARD</text>
  <text x="96" y="46" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#f0928f" opacity="0.8">strenuous climb</text>
</svg>