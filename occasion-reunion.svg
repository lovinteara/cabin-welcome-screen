<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg-re" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a0a"/>
      <stop offset="100%" style="stop-color:#0a1a2a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg-re)" rx="12"/>
  <!-- Bunting flags -->
  <line x1="20" y1="30" x2="380" y2="30" stroke="#c8973a" stroke-width="1.5" opacity="0.6"/>
  <polygon points="40,30 55,30 47,50" fill="#f0928f"/>
  <polygon points="70,30 85,30 77,50" fill="#ffd700"/>
  <polygon points="100,30 115,30 107,50" fill="#5cb874"/>
  <polygon points="130,30 145,30 137,50" fill="#5fa8b8"/>
  <polygon points="160,30 175,30 167,50" fill="#f0928f"/>
  <polygon points="190,30 205,30 197,50" fill="#ffd700"/>
  <polygon points="220,30 235,30 227,50" fill="#5cb874"/>
  <polygon points="250,30 265,30 257,50" fill="#5fa8b8"/>
  <polygon points="280,30 295,30 287,50" fill="#f0928f"/>
  <polygon points="310,30 325,30 317,50" fill="#ffd700"/>
  <polygon points="340,30 355,30 347,50" fill="#5cb874"/>
  <!-- People silhouettes - family group -->
  <circle cx="130" cy="170" r="14" fill="#c8973a"/>
  <rect x="122" y="184" width="16" height="30" fill="#c8973a" rx="4"/>
  <circle cx="170" cy="165" r="16" fill="#5fa8b8"/>
  <rect x="161" y="181" width="18" height="32" fill="#5fa8b8" rx="4"/>
  <circle cx="200" cy="162" r="18" fill="#5cb874"/>
  <rect x="190" y="180" width="20" height="35" fill="#5cb874" rx="4"/>
  <circle cx="232" cy="165" r="16" fill="#f0928f"/>
  <rect x="223" y="181" width="18" height="32" fill="#f0928f" rx="4"/>
  <circle cx="268" cy="170" r="14" fill="#ffd700"/>
  <rect x="260" y="184" width="16" height="30" fill="#ffd700" rx="4"/>
  <!-- Small kid -->
  <circle cx="155" cy="188" r="10" fill="#c8973a" opacity="0.7"/>
  <rect x="149" y="198" width="12" height="18" fill="#c8973a" rx="3" opacity="0.7"/>
  <!-- Arms around each other hint -->
  <line x1="148" y1="200" x2="162" y2="198" stroke="#c8973a" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <line x1="188" y1="198" x2="202" y2="197" stroke="#5fa8b8" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <line x1="220" y1="197" x2="232" y2="198" stroke="#5cb874" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <line x1="250" y1="198" x2="264" y2="200" stroke="#f0928f" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <!-- Banner -->
  <rect x="55" y="65" width="290" height="52" fill="#1a2a3a" rx="8" opacity="0.9"/>
  <text x="200" y="88" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#ffd700" font-weight="bold">Family Reunion!</text>
  <text x="200" y="108" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#f0e8d0" opacity="0.7">So glad you are all here</text>
</svg>