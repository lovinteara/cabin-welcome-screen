<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg-gr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1a0a"/>
      <stop offset="100%" style="stop-color:#1a1a0a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg-gr)" rx="12"/>
  <!-- Confetti -->
  <rect x="25" y="15" width="8" height="8" fill="#ffd700" rx="2" transform="rotate(20,29,19)"/>
  <rect x="90" y="20" width="6" height="6" fill="#5cb874" rx="1" transform="rotate(35,93,23)"/>
  <rect x="310" y="10" width="8" height="8" fill="#f0928f" rx="2" transform="rotate(15,314,14)"/>
  <rect x="370" y="22" width="6" height="6" fill="#5fa8b8" rx="1" transform="rotate(45,373,25)"/>
  <circle cx="60" cy="45" r="4" fill="#ffd700" opacity="0.8"/>
  <circle cx="340" cy="40" r="3" fill="#5cb874" opacity="0.8"/>
  <!-- Diploma scroll -->
  <rect x="120" y="160" width="160" height="100" fill="#f8f0d0" rx="6"/>
  <rect x="115" y="158" width="10" height="104" fill="#c8973a" rx="5"/>
  <rect x="275" y="158" width="10" height="104" fill="#c8973a" rx="5"/>
  <text x="200" y="195" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#1a1a0a" font-weight="bold">DIPLOMA</text>
  <line x1="135" y1="205" x2="265" y2="205" stroke="#c8973a" stroke-width="1" opacity="0.5"/>
  <text x="200" y="222" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#3a3a1a" opacity="0.8">Presented to</text>
  <line x1="145" y1="238" x2="255" y2="238" stroke="#1a1a0a" stroke-width="1" opacity="0.4"/>
  <circle cx="200" cy="250" r="12" fill="#c8973a" opacity="0.8"/>
  <text x="200" y="254" text-anchor="middle" font-family="Arial" font-size="10" fill="#fff">★</text>
  <!-- Grad cap -->
  <rect x="155" y="118" width="90" height="14" fill="#1a1a0a" rx="2"/>
  <polygon points="200,95 155,118 245,118" fill="#1a1a0a"/>
  <ellipse cx="200" cy="95" rx="15" ry="8" fill="#1a1a0a"/>
  <!-- Tassel -->
  <line x1="245" y1="118" x2="268" y2="138" stroke="#ffd700" stroke-width="2"/>
  <rect x="262" y="138" width="4" height="20" fill="#ffd700" rx="1"/>
  <!-- Banner -->
  <rect x="55" y="50" width="290" height="48" fill="#2a4a1a" rx="8"/>
  <text x="200" y="80" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#ffd700" font-weight="bold">Congratulations!</text>
</svg>