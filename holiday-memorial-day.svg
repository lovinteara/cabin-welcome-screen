<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#0a1020" rx="12"/>
  <!-- American flag background subtle -->
  <rect x="0" y="200" width="400" height="15" fill="#c8303a" opacity="0.3"/>
  <rect x="0" y="215" width="400" height="15" fill="#fff" opacity="0.15"/>
  <rect x="0" y="230" width="400" height="15" fill="#c8303a" opacity="0.3"/>
  <rect x="0" y="245" width="400" height="15" fill="#fff" opacity="0.15"/>
  <rect x="0" y="260" width="400" height="40" fill="#c8303a" opacity="0.3"/>
  <!-- White cross / memorial -->
  <rect x="188" y="130" width="24" height="90" fill="#e8e8e8" rx="4"/>
  <rect x="155" y="155" width="90" height="24" fill="#e8e8e8" rx="4"/>
  <!-- Poppies -->
  <circle cx="100" cy="200" r="20" fill="#c8303a" opacity="0.8"/>
  <circle cx="100" cy="200" r="12" fill="#d84040" opacity="0.7"/>
  <circle cx="100" cy="200" r="5" fill="#1a1a1a"/>
  <ellipse cx="78" cy="190" rx="12" ry="7" fill="#c8303a" opacity="0.7" transform="rotate(-30,78,190)"/>
  <ellipse cx="122" cy="190" rx="12" ry="7" fill="#c8303a" opacity="0.7" transform="rotate(30,122,190)"/>
  <circle cx="300" cy="205" r="18" fill="#c8303a" opacity="0.8"/>
  <circle cx="300" cy="205" r="10" fill="#d84040" opacity="0.7"/>
  <circle cx="300" cy="205" r="4" fill="#1a1a1a"/>
  <!-- Stars in sky -->
  <circle cx="50" cy="50" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="150" cy="30" r="1.5" fill="#fff" opacity="0.7"/>
  <circle cx="250" cy="45" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="350" cy="35" r="1.5" fill="#fff" opacity="0.7"/>
  <!-- Flag on pole -->
  <rect x="310" y="80" width="4" height="120" fill="#c0c0c0"/>
  <rect x="314" y="80" width="50" height="35" fill="#c8303a"/>
  <rect x="314" y="91" width="50" height="8" fill="#fff"/>
  <rect x="314" y="103" width="50" height="12" fill="#c8303a"/>
  <rect x="314" y="80" width="22" height="35" fill="#1a1a5a"/>
  <!-- Banner -->
  <rect x="50" y="38" width="300" height="55" fill="#0a1020" rx="8" opacity="0.95" stroke="#c8303a" stroke-width="1"/>
  <text x="200" y="63" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#e8e8e8" font-weight="bold">Memorial Day</text>
  <text x="200" y="83" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#a0b8d0" opacity="0.8">Honor · Remember · Serve</text>
</svg>