<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#0a0a2a" rx="12"/>
  <!-- Fireworks -->
  <g transform="translate(100,80)">
    <line x1="0" y1="0" x2="0" y2="-45" stroke="#f0928f" stroke-width="2" opacity="0.9"/>
    <line x1="0" y1="0" x2="32" y2="-32" stroke="#f0928f" stroke-width="2" opacity="0.9"/>
    <line x1="0" y1="0" x2="45" y2="0" stroke="#f0928f" stroke-width="2" opacity="0.9"/>
    <line x1="0" y1="0" x2="32" y2="32" stroke="#f0928f" stroke-width="2" opacity="0.8"/>
    <line x1="0" y1="0" x2="0" y2="45" stroke="#f0928f" stroke-width="2" opacity="0.8"/>
    <line x1="0" y1="0" x2="-32" y2="32" stroke="#f0928f" stroke-width="2" opacity="0.8"/>
    <line x1="0" y1="0" x2="-45" y2="0" stroke="#f0928f" stroke-width="2" opacity="0.9"/>
    <line x1="0" y1="0" x2="-32" y2="-32" stroke="#f0928f" stroke-width="2" opacity="0.9"/>
    <circle cx="0" cy="-45" r="4" fill="#ffd700"/>
    <circle cx="32" cy="-32" r="4" fill="#ffd700"/>
    <circle cx="45" cy="0" r="4" fill="#ffd700"/>
    <circle cx="32" cy="32" r="3" fill="#f0928f"/>
    <circle cx="-45" cy="0" r="4" fill="#ffd700"/>
    <circle cx="-32" cy="-32" r="4" fill="#ffd700"/>
  </g>
  <g transform="translate(300,70)">
    <line x1="0" y1="0" x2="0" y2="-40" stroke="#5fa8b8" stroke-width="2" opacity="0.9"/>
    <line x1="0" y1="0" x2="28" y2="-28" stroke="#5fa8b8" stroke-width="2" opacity="0.9"/>
    <line x1="0" y1="0" x2="40" y2="0" stroke="#5fa8b8" stroke-width="2" opacity="0.9"/>
    <line x1="0" y1="0" x2="28" y2="28" stroke="#5fa8b8" stroke-width="2" opacity="0.8"/>
    <line x1="0" y1="0" x2="0" y2="40" stroke="#5fa8b8" stroke-width="2" opacity="0.8"/>
    <line x1="0" y1="0" x2="-28" y2="28" stroke="#5fa8b8" stroke-width="2" opacity="0.8"/>
    <line x1="0" y1="0" x2="-40" y2="0" stroke="#5fa8b8" stroke-width="2" opacity="0.9"/>
    <line x1="0" y1="0" x2="-28" y2="-28" stroke="#5fa8b8" stroke-width="2" opacity="0.9"/>
    <circle cx="0" cy="-40" r="4" fill="#fff"/>
    <circle cx="40" cy="0" r="4" fill="#fff"/>
    <circle cx="-40" cy="0" r="4" fill="#fff"/>
    <circle cx="0" cy="40" r="3" fill="#5fa8b8"/>
  </g>
  <g transform="translate(200,130)">
    <line x1="0" y1="0" x2="0" y2="-35" stroke="#ffd700" stroke-width="2" opacity="0.9"/>
    <line x1="0" y1="0" x2="25" y2="-25" stroke="#ffd700" stroke-width="2" opacity="0.9"/>
    <line x1="0" y1="0" x2="35" y2="0" stroke="#ffd700" stroke-width="2" opacity="0.9"/>
    <line x1="0" y1="0" x2="25" y2="25" stroke="#ffd700" stroke-width="2" opacity="0.8"/>
    <line x1="0" y1="0" x2="-35" y2="0" stroke="#ffd700" stroke-width="2" opacity="0.9"/>
    <line x1="0" y1="0" x2="-25" y2="-25" stroke="#ffd700" stroke-width="2" opacity="0.9"/>
    <line x1="0" y1="0" x2="0" y2="35" stroke="#ffd700" stroke-width="2" opacity="0.8"/>
    <line x1="0" y1="0" x2="-25" y2="25" stroke="#ffd700" stroke-width="2" opacity="0.8"/>
    <circle cx="0" cy="-35" r="5" fill="#ffd700"/>
    <circle cx="35" cy="0" r="5" fill="#ffd700"/>
    <circle cx="-35" cy="0" r="5" fill="#ffd700"/>
    <circle cx="0" cy="35" r="4" fill="#f0c830"/>
  </g>
  <!-- Flag stripes silhouette at bottom -->
  <rect x="0" y="240" width="400" height="12" fill="#c8303a" opacity="0.9"/>
  <rect x="0" y="252" width="400" height="12" fill="#fff" opacity="0.8"/>
  <rect x="0" y="264" width="400" height="12" fill="#c8303a" opacity="0.9"/>
  <rect x="0" y="276" width="400" height="24" fill="#fff" opacity="0.8"/>
  <rect x="0" y="240" width="160" height="48" fill="#1a1a6a" opacity="0.85"/>
  <!-- Stars on flag -->
  <circle cx="20" cy="250" r="2" fill="#fff" opacity="0.9"/>
  <circle cx="40" cy="250" r="2" fill="#fff" opacity="0.9"/>
  <circle cx="60" cy="250" r="2" fill="#fff" opacity="0.9"/>
  <circle cx="80" cy="250" r="2" fill="#fff" opacity="0.9"/>
  <circle cx="30" cy="260" r="2" fill="#fff" opacity="0.9"/>
  <circle cx="50" cy="260" r="2" fill="#fff" opacity="0.9"/>
  <circle cx="70" cy="260" r="2" fill="#fff" opacity="0.9"/>
  <!-- Banner -->
  <rect x="55" y="195" width="290" height="40" fill="#1a1a5a" rx="8" opacity="0.95"/>
  <text x="200" y="221" text-anchor="middle" font-family="Georgia,serif" font-size="20" fill="#ffd700" font-weight="bold">Happy 4th of July!</text>
</svg>