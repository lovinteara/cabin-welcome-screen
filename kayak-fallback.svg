<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <!-- Sky/water background -->
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a4a6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d8a7a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d8a7a;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#1a5a4a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="kayak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c8973a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e4b86a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8973a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="260" fill="url(#sky)" rx="12"/>
  
  <!-- Mountains in background -->
  <polygon points="0,160 60,80 120,140 180,60 240,130 300,70 360,120 400,90 400,160" fill="#1e3a2f" opacity="0.6"/>
  <polygon points="0,160 40,100 100,150 160,90 220,140 280,85 340,130 400,100 400,160" fill="#1e3a2f" opacity="0.4"/>
  
  <!-- Water -->
  <rect x="0" y="155" width="400" height="105" fill="url(#water)" rx="0"/>
  
  <!-- Water ripples -->
  <ellipse cx="80" cy="175" rx="40" ry="4" fill="none" stroke="#5fa8b8" stroke-width="1" opacity="0.4"/>
  <ellipse cx="200" cy="185" rx="55" ry="4" fill="none" stroke="#5fa8b8" stroke-width="1" opacity="0.3"/>
  <ellipse cx="320" cy="172" rx="35" ry="3" fill="none" stroke="#5fa8b8" stroke-width="1" opacity="0.4"/>
  <ellipse cx="150" cy="210" rx="45" ry="4" fill="none" stroke="#5fa8b8" stroke-width="1" opacity="0.25"/>
  <ellipse cx="300" cy="205" rx="30" ry="3" fill="none" stroke="#5fa8b8" stroke-width="1" opacity="0.25"/>

  <!-- Trees on banks -->
  <polygon points="15,155 25,110 35,155" fill="#2d5a45"/>
  <polygon points="30,155 42,95 54,155" fill="#1e3a2f"/>
  <polygon points="355,155 368,105 381,155" fill="#2d5a45"/>
  <polygon points="370,155 382,118 394,155" fill="#1e3a2f"/>

  <!-- Kayak body -->
  <ellipse cx="200" cy="168" rx="90" ry="14" fill="url(#kayak)" opacity="0.95"/>
  <ellipse cx="200" cy="168" rx="90" ry="14" fill="none" stroke="#a07020" stroke-width="1.5"/>
  
  <!-- Kayak cockpit -->
  <ellipse cx="200" cy="165" rx="22" ry="9" fill="#1a2a1a" opacity="0.8"/>
  <ellipse cx="200" cy="164" rx="18" ry="6" fill="#2d4a2d" opacity="0.6"/>

  <!-- Kayaker body -->
  <ellipse cx="200" cy="152" rx="14" ry="10" fill="#3d6a9a" opacity="0.95"/>
  
  <!-- Kayaker head -->
  <circle cx="200" cy="138" r="11" fill="#d4956a"/>
  
  <!-- Life jacket -->
  <ellipse cx="200" cy="153" rx="16" ry="8" fill="#e84040" opacity="0.9"/>
  
  <!-- Paddle -->
  <line x1="140" y1="148" x2="260" y2="158" stroke="#8a6030" stroke-width="3" stroke-linecap="round"/>
  <!-- Paddle blades -->
  <ellipse cx="135" cy="147" rx="14" ry="6" fill="#5fa8b8" opacity="0.9" transform="rotate(-15,135,147)"/>
  <ellipse cx="265" cy="159" rx="14" ry="6" fill="#5fa8b8" opacity="0.9" transform="rotate(-15,265,159)"/>

  <!-- Kayak reflection in water -->
  <ellipse cx="200" cy="182" rx="85" ry="6" fill="#c8973a" opacity="0.15"/>
  
  <!-- Sun/glow -->
  <circle cx="340" cy="45" r="22" fill="#ffd700" opacity="0.3"/>
  <circle cx="340" cy="45" r="15" fill="#ffd700" opacity="0.5"/>
  
  <!-- Text -->
  <text x="200" y="230" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#f0e8d0" opacity="0.9">Big Springs Float</text>
  <text x="200" y="248" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#9dcbbf" opacity="0.8">Henry's Fork · Island Park, Idaho</text>
</svg>