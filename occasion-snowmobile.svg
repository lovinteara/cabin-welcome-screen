<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg-snow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2a4a"/>
      <stop offset="100%" style="stop-color:#0a1a3a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg-snow)" rx="12"/>
  <!-- Snow ground -->
  <rect x="0" y="210" width="400" height="90" fill="#e8f0f8" rx="0"/>
  <ellipse cx="200" cy="210" rx="200" ry="12" fill="#d0e0f0"/>
  <!-- Snowflakes -->
  <g stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
    <line x1="40" y1="50" x2="40" y2="66"/><line x1="32" y1="54" x2="48" y2="62"/><line x1="32" y1="62" x2="48" y2="54"/>
    <line x1="350" y1="40" x2="350" y2="56"/><line x1="342" y1="44" x2="358" y2="52"/><line x1="342" y1="52" x2="358" y2="44"/>
    <line x1="100" y1="80" x2="100" y2="92"/><line x1="94" y1="83" x2="106" y2="89"/><line x1="94" y1="89" x2="106" y2="83"/>
    <line x1="300" y1="70" x2="300" y2="82"/><line x1="294" y1="73" x2="306" y2="79"/><line x1="294" y1="79" x2="306" y2="73"/>
  </g>
  <!-- Stars -->
  <circle cx="180" cy="30" r="1.5" fill="#fff" opacity="0.8"/>
  <circle cx="240" cy="45" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="150" cy="55" r="2" fill="#fff" opacity="0.7"/>
  <!-- Snowmobile -->
  <rect x="120" y="175" width="160" height="38" fill="#c8303a" rx="8"/>
  <rect x="145" y="160" width="90" height="28" fill="#e04040" rx="6"/>
  <rect x="155" y="163" width="35" height="18" fill="#90c8e0" rx="3" opacity="0.8"/>
  <rect x="200" y="163" width="25" height="18" fill="#90c8e0" rx="3" opacity="0.8"/>
  <ellipse cx="145" cy="213" rx="18" ry="8" fill="#2a2a2a"/>
  <ellipse cx="255" cy="213" rx="18" ry="8" fill="#2a2a2a"/>
  <rect x="115" y="195" width="12" height="30" fill="#3a3a3a" rx="4" transform="rotate(-15,121,210)"/>
  <!-- Rider -->
  <circle cx="195" cy="150" r="14" fill="#4a3a2a"/>
  <rect x="182" y="158" width="26" height="22" fill="#c8303a" rx="4"/>
  <!-- Speed lines -->
  <line x1="80" y1="185" x2="118" y2="185" stroke="#fff" stroke-width="2" opacity="0.5" stroke-dasharray="4,3"/>
  <line x1="65" y1="193" x2="118" y2="193" stroke="#fff" stroke-width="1.5" opacity="0.4" stroke-dasharray="4,3"/>
  <line x1="75" y1="201" x2="118" y2="201" stroke="#fff" stroke-width="1" opacity="0.3" stroke-dasharray="4,3"/>
  <!-- Snow spray -->
  <ellipse cx="280" cy="210" rx="25" ry="8" fill="#fff" opacity="0.6"/>
  <ellipse cx="295" cy="205" rx="15" ry="5" fill="#fff" opacity="0.4"/>
  <!-- Banner -->
  <rect x="55" y="30" width="290" height="52" fill="#1a2a5a" rx="8" opacity="0.95"/>
  <text x="200" y="58" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#ffd700" font-weight="bold">Snowmobile Trip!</text>
  <text x="200" y="77" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#a0c8e0" opacity="0.8">Let it snow!</text>
</svg>