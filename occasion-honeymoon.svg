<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg-hm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1a3a"/>
      <stop offset="100%" style="stop-color:#1a0a1a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg-hm)" rx="12"/>
  <!-- Stars -->
  <circle cx="50" cy="40" r="1.5" fill="#fff" opacity="0.8"/>
  <circle cx="120" cy="25" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="200" cy="35" r="2" fill="#fff" opacity="0.9"/>
  <circle cx="290" cy="20" r="1.5" fill="#fff" opacity="0.7"/>
  <circle cx="360" cy="45" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="80" cy="70" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="330" cy="65" r="1.5" fill="#fff" opacity="0.7"/>
  <!-- Moon -->
  <circle cx="320" cy="60" r="35" fill="#f8e880" opacity="0.15"/>
  <circle cx="320" cy="60" r="28" fill="#f8e060" opacity="0.9"/>
  <circle cx="332" cy="52" r="22" fill="#0a1a3a"/>
  <!-- Mountains silhouette -->
  <polygon points="0,200 60,120 120,200" fill="#1a2a4a"/>
  <polygon points="55,200 130,100 205,200" fill="#1a3050"/>
  <polygon points="150,200 220,115 290,200" fill="#1a2a4a"/>
  <polygon points="270,200 330,125 390,200" fill="#1a3050"/>
  <polygon points="340,200 400,140 400,200" fill="#1a2a4a"/>
  <!-- Water reflection -->
  <rect x="0" y="200" width="400" height="100" fill="#0a1828"/>
  <ellipse cx="320" cy="200" rx="60" ry="15" fill="#f8e060" opacity="0.1"/>
  <line x1="320" y1="200" x2="320" y2="300" stroke="#f8e060" stroke-width="3" opacity="0.08"/>
  <!-- Two silhouette figures -->
  <circle cx="175" cy="175" r="10" fill="#0a0a1a"/>
  <rect x="170" y="185" width="10" height="20" fill="#0a0a1a" rx="3"/>
  <circle cx="205" cy="173" r="10" fill="#0a0a1a"/>
  <rect x="200" y="183" width="10" height="20" fill="#0a0a1a" rx="3"/>
  <!-- Holding hands -->
  <line x1="181" y1="195" x2="199" y2="193" stroke="#0a0a1a" stroke-width="4" stroke-linecap="round"/>
  <!-- Heart above -->
  <path d="M188,158 C188,150 178,147 175,153 C172,147 162,150 162,158 C162,166 175,174 175,174 C175,174 188,166 188,158Z" fill="#e04050" opacity="0.9"/>
  <!-- Banner -->
  <rect x="60" y="45" width="220" height="42" fill="#2a0a2e" rx="8" opacity="0.9"/>
  <text x="170" y="72" text-anchor="middle" font-family="Georgia,serif" font-size="20" fill="#ffd700" font-weight="bold">Honeymoon!</text>
</svg>