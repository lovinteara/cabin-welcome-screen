<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>EV Charging Dashboard</title>
<style>
  :root{
    --bg:#14110d; --panel:#1e1a14; --panel-edge:#322b21;
    --ink:#f3ece0; --ink-dim:#a89d8a; --gold:#e3a008;
    --green:#5fb878; --amber:#e0a030; --grey:#6b6256;
    --red:#d9694e; --blue:#6fa8d9;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"Iowan Old Style",Georgia,"Times New Roman",serif;
    -webkit-font-smoothing:antialiased;padding:28px 18px 60px;
  }
  .wrap{max-width:1040px;margin:0 auto}
  header{
    display:flex;align-items:baseline;justify-content:space-between;
    gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--panel-edge);
    padding-bottom:16px;margin-bottom:18px;
  }
  h1{font-size:26px;font-weight:600;letter-spacing:.3px;margin:0}
  h1 .sub{
    display:block;font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-size:11px;letter-spacing:2.5px;text-transform:uppercase;
    color:var(--gold);margin-bottom:6px;font-weight:400;
  }
  .updated{font-size:12px;color:var(--ink-dim);font-family:ui-monospace,Menlo,monospace}

  /* Controls */
  .controls{
    display:flex;gap:10px 14px;flex-wrap:wrap;align-items:flex-end;
    background:var(--panel);border:1px solid var(--panel-edge);
    border-radius:10px;padding:14px 16px;margin-bottom:18px;
  }
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{
    font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:1.5px;
    text-transform:uppercase;color:var(--ink-dim);
  }
  input,select{
    font:inherit;font-size:14px;background:#0f0c08;color:var(--ink);
    border:1px solid var(--panel-edge);border-radius:6px;padding:8px 10px;
  }
  input[type=number]{width:92px}
  input[type=date]{color-scheme:dark}
  button{
    font:inherit;font-size:13px;background:var(--gold);color:#1a1206;
    border:none;border-radius:6px;padding:9px 16px;cursor:pointer;
    font-weight:600;letter-spacing:.3px;
  }
  button:hover{filter:brightness(1.08)}
  button.ghost{background:transparent;color:var(--ink-dim);border:1px solid var(--panel-edge)}
  button.ghost.on{color:var(--gold);border-color:var(--gold)}
  .presets{display:flex;gap:6px;flex-wrap:wrap}
  .presets button{padding:8px 12px;font-size:12px}

  .banner{
    background:rgba(224,160,48,.13);border:1px solid rgba(224,160,48,.4);
    color:var(--amber);border-radius:8px;padding:11px 14px;margin-bottom:18px;
    font-size:13px;line-height:1.5;
  }
  .banner b{color:var(--ink)}

  /* Summary tiles */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
  .tile{
    background:var(--panel);border:1px solid var(--panel-edge);border-radius:10px;
    padding:16px 18px;border-top:3px solid var(--gold);
  }
  .tile .k{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:1.5px;
    text-transform:uppercase;color:var(--ink-dim)}
  .tile .v{font-size:30px;font-weight:600;margin-top:6px;line-height:1}
  .tile .v small{font-size:15px;color:var(--ink-dim);font-weight:400}
  .tile.money{border-top-color:var(--green)}

  /* Charger cards */
  .grid{display:flex;flex-direction:column;gap:14px}
  .card{
    background:var(--panel);border:1px solid var(--panel-edge);
    border-left:4px solid var(--green);border-radius:10px;padding:16px 18px;
  }
  .card.empty{border-left-color:var(--grey);opacity:.75}
  .card-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .cabin-name{font-size:19px;font-weight:600}
  .card-tot{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--ink-dim)}
  .card-tot b{color:var(--ink);font-size:15px}
  .card-tot .amt{color:var(--green)}

  table{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
  th{
    text-align:left;font-family:ui-monospace,Menlo,monospace;font-size:10px;
    letter-spacing:1px;text-transform:uppercase;color:var(--ink-dim);
    font-weight:400;padding:0 10px 8px;border-bottom:1px solid var(--panel-edge);
  }
  th.num,td.num{text-align:right}
  td{padding:9px 10px;border-bottom:1px solid rgba(50,43,33,.5)}
  tr:last-child td{border-bottom:none}
  .guest{font-weight:600}
  .stay{font-size:11px;color:var(--ink-dim);font-family:ui-monospace,Menlo,monospace}
  td.amt{color:var(--green);font-family:ui-monospace,Menlo,monospace}
  .copy{
    background:none;border:1px solid var(--panel-edge);color:var(--ink-dim);
    padding:4px 9px;font-size:11px;border-radius:5px;
  }
  .copy:hover{color:var(--gold);border-color:var(--gold)}
  .copy.done{color:var(--green);border-color:var(--green)}

  .toggle{
    font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--gold);
    background:none;border:none;cursor:pointer;padding:10px 0 0;letter-spacing:.5px;
  }
  .sessions{display:none;margin-top:10px}
  .sessions.open{display:block}
  .sessions td,.sessions th{font-size:12px}
  .none{color:var(--ink-dim);font-style:italic;padding-top:12px;font-size:13px}
  .loading{color:var(--ink-dim);font-style:italic;padding:30px 0}
  footer{margin-top:34px;font-size:12px;color:var(--grey);line-height:1.7;
    border-top:1px solid var(--panel-edge);padding-top:16px}
  footer code{color:var(--ink-dim)}
  @media(max-width:640px){
    .tiles{grid-template-columns:1fr 1fr}
    .tile .v{font-size:24px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="sub">Visit Island Park · EV Charging</span>Charging Dashboard</h1>
    <span class="updated" id="updated"></span>
  </header>

  <div class="controls">
    <div class="field">
      <label>Quick range</label>
      <div class="presets" id="presets">
        <button data-range="thisMonth" class="ghost">This month</button>
        <button data-range="lastMonth" class="ghost">Last month</button>
        <button data-range="30" class="ghost">Last 30 days</button>
        <button data-range="ytd" class="ghost">Year to date</button>
      </div>
    </div>
    <div class="field">
      <label for="from">From</label>
      <input type="date" id="from"/>
    </div>
    <div class="field">
      <label for="to">To</label>
      <input type="date" id="to"/>
    </div>
    <div class="field">
      <label for="rate">Rate $/kWh</label>
      <input type="number" id="rate" step="0.01" min="0" value="0.16"/>
    </div>
    <button id="run">Update</button>
  </div>

  <div id="banner"></div>
  <div class="tiles" id="tiles"></div>
  <div class="grid" id="grid"><div class="loading">Loading charging data…</div></div>

  <footer id="footer"></footer>
</div>

<script>
  const $ = id => document.getElementById(id);
  const fromEl = $('from'), toEl = $('to'), rateEl = $('rate');

  const fmtKwh = n => (Math.round(n*10)/10).toLocaleString();
  const fmt$ = n => '$' + (Math.round(n*100)/100).toFixed(2);
  const ymd = d => d.toLocaleDateString('en-CA'); // YYYY-MM-DD local

  function setRange(kind){
    const now = new Date();
    let from, to;
    if(kind==='thisMonth'){
      from = new Date(now.getFullYear(), now.getMonth(), 1);
      to = new Date(now.getFullYear(), now.getMonth()+1, 0);
    }else if(kind==='lastMonth'){
      from = new Date(now.getFullYear(), now.getMonth()-1, 1);
      to = new Date(now.getFullYear(), now.getMonth(), 0);
    }else if(kind==='30'){
      to = now; from = new Date(now.getTime()-29*86400000);
    }else if(kind==='ytd'){
      from = new Date(now.getFullYear(), 0, 1); to = now;
    }
    fromEl.value = ymd(from); toEl.value = ymd(to);
    [...$('presets').children].forEach(b=>b.classList.toggle('on', b.dataset.range===kind));
  }

  function fmtStay(a,d){
    if(!a||!d) return '';
    const s = x => new Date(x+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
    return s(a)+' – '+s(d);
  }
  function fmtWhen(iso){
    if(!iso) return '';
    return new Date(iso).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  }

  async function load(){
    $('grid').innerHTML = '<div class="loading">Loading charging data…</div>';
    $('tiles').innerHTML = ''; $('banner').innerHTML = '';
    const params = new URLSearchParams({from:fromEl.value, to:toEl.value, rate:rateEl.value||'0.16'});
    let data;
    try{
      const res = await fetch('/api/charging?'+params.toString());
      data = await res.json();
    }catch(e){
      $('grid').innerHTML = '<div class="none">Couldn\'t reach the charging service. Try again in a moment.</div>';
      return;
    }
    render(data);
  }

  function render(data){
    $('updated').textContent = 'Updated ' + new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});

    if(data.demo){
      $('banner').innerHTML = '<b>Showing sample data.</b> Add your ChargePoint logins in Netlify '+
        '(see <code>CHARGEPOINT_SETUP.md</code>) and this switches to real usage automatically — '+
        'sessions will then be matched to the actual guest staying that night.';
    }

    const t = data.totals;
    $('tiles').innerHTML = `
      <div class="tile"><div class="k">Total energy</div><div class="v">${fmtKwh(t.kwh)} <small>kWh</small></div></div>
      <div class="tile money"><div class="k">Estimated to bill</div><div class="v">${fmt$(t.cost)}</div></div>
      <div class="tile"><div class="k">Sessions</div><div class="v">${t.sessions}</div></div>
      <div class="tile"><div class="k">At rate</div><div class="v">${fmt$(data.rate)}<small>/kWh</small></div></div>`;

    const grid = $('grid');
    grid.innerHTML = '';
    data.chargers.forEach(c=>{
      const card = document.createElement('div');
      card.className = 'card' + (c.sessionCount===0 ? ' empty':'');

      const guestRows = c.guests.length ? c.guests.map(g=>`
        <tr>
          <td class="guest">${esc(g.name)}</td>
          <td class="num">${fmtKwh(g.kwh)}</td>
          <td class="num">${g.sessions}</td>
          <td class="num amt">${fmt$(g.cost)}</td>
          <td class="num"><button class="copy" data-line="${esc(billLine(c,g,data))}">Copy</button></td>
        </tr>`).join('') : '';

      const sessionRows = c.sessions.map(s=>`
        <tr>
          <td>${fmtWhen(s.start)}</td>
          <td>${esc(s.station)}</td>
          <td>${esc(s.guest)}</td>
          <td class="num">${fmtKwh(s.kwh)}</td>
          <td class="num amt">${fmt$(s.cost)}</td>
        </tr>`).join('');

      card.innerHTML = `
        <div class="card-head">
          <div class="cabin-name">${esc(c.label)}</div>
          <div class="card-tot"><b>${fmtKwh(c.totalKwh)}</b> kWh · <span class="amt">${fmt$(c.totalCost)}</span> · ${c.sessionCount} session${c.sessionCount===1?'':'s'}</div>
        </div>
        ${ c.sessionCount===0
            ? '<div class="none">No charging in this date range.</div>'
            : `<table>
                <thead><tr><th>Guest</th><th class="num">kWh</th><th class="num">Sessions</th><th class="num">Amount</th><th></th></tr></thead>
                <tbody>${guestRows}</tbody>
               </table>
               <button class="toggle">▸ Show ${c.sessionCount} individual session${c.sessionCount===1?'':'s'}</button>
               <div class="sessions">
                 <table>
                   <thead><tr><th>When</th><th>Charger</th><th>Guest</th><th class="num">kWh</th><th class="num">Amount</th></tr></thead>
                   <tbody>${sessionRows}</tbody>
                 </table>
               </div>`
        }`;
      grid.appendChild(card);
    });

    // Wire toggles + copy buttons
    grid.querySelectorAll('.toggle').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const s = btn.nextElementSibling;
        const open = s.classList.toggle('open');
        btn.textContent = (open?'▾ Hide':'▸ Show') + btn.textContent.replace(/^[▸▾] (Show|Hide)/,'');
      });
    });
    grid.querySelectorAll('.copy').forEach(btn=>{
      btn.addEventListener('click',()=>{
        navigator.clipboard.writeText(btn.dataset.line).then(()=>{
          btn.textContent='Copied'; btn.classList.add('done');
          setTimeout(()=>{btn.textContent='Copy'; btn.classList.remove('done');},1400);
        });
      });
    });

    $('footer').innerHTML =
      `Pulls charging session history from each cabin's ChargePoint account and matches every session `+
      `to the guest staying that night (via OwnerRez), then estimates the bill at your $/kWh rate. `+
      `${data.demo?'<b>Currently showing sample data.</b> ':''}`+
      `Range: ${data.from} → ${data.to}. Energy is measured; the dollar figure is an estimate you set the rate for.`;
  }

  function billLine(c,g,data){
    return `${g.name} — EV charging at ${c.label}, ${data.from} to ${data.to}: `+
           `${fmtKwh(g.kwh)} kWh × ${fmt$(data.rate)}/kWh = ${fmt$(g.cost)}`;
  }
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

  // init
  setRange('thisMonth');
  $('run').addEventListener('click', load);
  $('presets').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    setRange(b.dataset.range); load();
  });
  load();
</script>
</body>
</html>
